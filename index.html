<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NolyWhot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="homeScreen">

    <div class="logoArea">

        <h1 class="gameTitle">NolyWhot</h1>

        <p class="gameSubTitle">
            Nigerian Whot Card Game
        </p>

    </div>

    <button id="playBtn" class="menuButton">
        ▶ PLAY
    </button>

</div>


<div id="modeScreen" style="display:none;">

    <h2>Select Game Mode</h2>

    <button id="computerBtn" class="menuButton">
        🤖 Play vs Computer
    </button>

    <button id="onlineBtn" class="menuButton">
        🌍 Online Multiplayer
    </button>

    <button id="backBtn" class="menuButton">
        ← Back
    </button>

</div>


<script>

const playBtn = document.getElementById("playBtn");
const modeScreen = document.getElementById("modeScreen");
const homeScreen = document.getElementById("homeScreen");

const computerBtn = document.getElementById("computerBtn");
const onlineBtn = document.getElementById("onlineBtn");
const backBtn = document.getElementById("backBtn");


/* PLAY */
playBtn.onclick = function(){

    homeScreen.style.display = "none";
    modeScreen.style.display = "flex";

};


/* BACK */
backBtn.onclick = function(){

    modeScreen.style.display = "none";
    homeScreen.style.display = "flex";

};


/* PLAY VS COMPUTER */
computerBtn.onclick = function(){

    location.href = "play.html?mode=computer";

};


/* ONLINE MULTIPLAYER */
onlineBtn.onclick = function(){

    location.href = "play.html?mode=online";

};

</script>

</body>
</html>
