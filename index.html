<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - NolyWhot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="logo-area">
            <h1>NolyWhot</h1>
            <p>Welcome back, player</p>
        </div>

        <div class="auth-box">

            <h2>LOGIN</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                autocomplete="email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginButton">
                LOGIN
            </button>

            <button
                class="link-button"
                onclick="window.location.href='signup.html'"
            >
                Don't have an account? SIGN UP
            </button>

        </div>

        <p class="version">
            NolyWhot V3
        </p>

    </div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyAI6i5KtbiXbI1nbq3FejALTKCQ1EADvP8",
    authDomain: "nolywhot.firebaseapp.com",
    databaseURL: "https://nolywhot-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "nolywhot",
    storageBucket: "nolywhot.firebasestorage.app",
    messagingSenderId: "543801656851",
    appId: "1:543801656851:web:6d04824d5610304c80a1e6",
    measurementId: "G-HGS0F2TMRF"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        if (!email || !password) {

            alert("Please enter your email and password.");
            return;
        }


        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "Login successful:",
                userCredential.user.uid
            );


            alert("Login successful!");


            window.location.href = "home.html";


        } catch (error) {

            console.error("LOGIN ERROR:", error);


            if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password" ||
                error.code === "auth/user-not-found"
            ) {

                alert("Incorrect email or password.");

            } else if (error.code === "auth/invalid-email") {

                alert("Please enter a valid email address.");

            } else {

                alert(
                    "Could not log in: " +
                    error.message
                );
            }
        }

    });

</script>

</body>
</html>
