<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NolyWhot Home</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="auth-container">

    <div class="logo-area">

        <img
            src="assets/logo.png"
            class="homeLogoImage"
            alt="NolyWhot Logo">

        <p>Welcome to NolyWhot</p>

    </div>

    <div class="auth-box">

        <h2 id="welcomeMessage">
            Welcome, Player
        </h2>

        <p id="usernameDisplay">
            Loading profile...
        </p>

        <button id="playButton">
            PLAY WHOT
        </button>

        <button
            class="link-button"
            id="logoutButton"
        >
            LOG OUT
        </button>

    </div>

    <p class="version">
        NolyWhot V3
    </p>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyAI6i5KtbiXbI1nbq3FejALTKCQ1EADvP8",
    authDomain: "nolywhot.firebaseapp.com",
    databaseURL: "https://nolywhot-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "nolywhot",
    storageBucket: "nolywhot.firebasestorage.app",
    messagingSenderId: "543801656851",
    appId: "1:543801656851:web:6d04824d5610304c80a1e6",
    measurementId: "G-HGS0F2TMRF"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "index.html";

        return;
    }


    try {

        const userRef =
            ref(database, "users/" + user.uid);

        const snapshot =
            await get(userRef);


        if (snapshot.exists()) {

            const profile = snapshot.val();

            document.getElementById("welcomeMessage").textContent =
                "Welcome, " + profile.username;

            document.getElementById("usernameDisplay").textContent =
                "Player: " + profile.username;

        } else {

            document.getElementById("welcomeMessage").textContent =
                "Welcome, Player";

            document.getElementById("usernameDisplay").textContent =
                "Profile not found.";

        }

    } catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );

        document.getElementById("usernameDisplay").textContent =
            "Could not load profile.";

    }

});


document
    .getElementById("playButton")
    .addEventListener("click", () => {

        window.location.href = "play.html?mode=select";

    });


document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            window.location.href = "index.html";

        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );

            alert("Could not log out.");

        }

    });

</script></body>
</html>
